{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Is It New Year?</title>
    <link rel="stylesheet" type="text/css" href="{% static 'newyear/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1 class="is-newyear">
            {% if newyear %}
                Yes!
            {% else %}
                No.
            {% endif %}
        </h1>
        <h2 class="countdown-label">Countdown to New Year</h2>
        <p id="countdown" class="countdown-timer"></p>
    </div>

    <script>
        const targetDate = new Date("{{ new_year_datetime }}").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                document.getElementById("countdown").innerHTML = "🎉 Happy New Year!";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
